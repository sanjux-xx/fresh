{# Header install control. Hidden until the browser confirms the app is
   installable; static/js/productfilter.js reveals it. Sits beside the bell so
   it is always reachable without ever covering content. #}
<button id="install-btn" class="hidden" data-action="install-app"
        title="Install ProductFilter as an app" aria-label="Install app">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
  </svg>
  <span class="lbl">Install</span>
</button>
